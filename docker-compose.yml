# Production-like setup on your own machine: Postgres, MinIO (a local
# S3/R2 stand-in), the API and one worker, each in its own container.
#
#   docker compose up --build        then open http://localhost:8000
#   docker compose up --scale worker=3   three workers sharing the queue
#
# For day-to-day coding you don't need this: `pep serve` with SQLite and an
# inline worker is simpler (see README). Use compose to test the real shape:
# separate processes, a real Postgres queue (SKIP LOCKED), S3 storage.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pep
      POSTGRES_PASSWORD: pep
      POSTGRES_DB: pep
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pep"]
      interval: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pep
      MINIO_ROOT_PASSWORD: pep-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]

  make-bucket:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 pep pep-secret; do sleep 1; done;
             mc mb -p local/pep-clips"

  api:
    build: { context: ., dockerfile: Dockerfile }
    env_file: .env
    environment: &common
      PEP_DATABASE_URL: postgresql+psycopg://pep:pep@db:5432/pep
      PEP_STORAGE: s3
      PEP_S3_BUCKET: pep-clips
      PEP_S3_ENDPOINT: http://minio:9000
      PEP_S3_ACCESS_KEY: pep
      PEP_S3_SECRET_KEY: pep-secret
      PEP_S3_REGION: us-east-1
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      make-bucket: { condition: service_completed_successfully }

  worker:
    build: { context: ., dockerfile: Dockerfile.worker }
    env_file: .env
    environment: *common
    depends_on:
      db: { condition: service_healthy }
    # Docker sends SIGTERM and waits this long before SIGKILL: time to finish a clip.
    stop_grace_period: 120s

volumes:
  pgdata:
  minio:
