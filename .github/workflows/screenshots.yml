# Screenshots of the real app, taken by a robot.
#
# Builds the Flutter web app in "screenshot mode" (it logs in as a demo player),
# starts the real Pep API on a demo database (scripts/seed_demo.py), opens each
# screen in headless Chrome at a phone's size, and saves PNGs to the
# `screenshots` branch. Run it by hand: Actions > Screenshots > Run workflow.
# Handbook chapter 04 explains workflows like this one.
name: Screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/lib/**", "pep/players/**", ".github/workflows/screenshots.yml"]

permissions:
  contents: write

jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-color-emoji
      - run: pip install -e ".[dev]"
      - name: Start the API with a demo player
        env:
          PEP_DATABASE_URL: sqlite:////tmp/pep.db
          PEP_STORAGE_DIR: /tmp/files
        run: |
          python scripts/seed_demo.py
          nohup pep serve --port 8000 > /tmp/api.log 2>&1 &
          sleep 5 && curl -sf localhost:8000/healthz
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Build the web app in screenshot mode
        working-directory: app
        run: |
          ./tool/setup_platforms.sh
          flutter build web --release --dart-define=PEP_API_URL=http://localhost:8000 \
            --dart-define=PEP_DEMO_EMAIL=demo@tracka.app --dart-define=PEP_DEMO_PASSWORD=tracka-demo-123
          nohup python -m http.server 8080 -d build/web > /tmp/web.log 2>&1 &
          sleep 2
      - name: Take screenshots
        run: |
          mkdir -p shots
          # A shot under ~40 KB is the splash screen (the app hadn't finished loading): try again.
          shoot() {
            for budget in 20000 40000 60000; do
              google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
                --window-size=430,932 --force-device-scale-factor=2 --virtual-time-budget=$budget \
                --screenshot="shots/$1.png" "http://localhost:8080/?$2"
              [ "$(stat -c%s "shots/$1.png")" -gt 40000 ] && break
            done
          }
          shoot 1-welcome "welcome=1"
          shoot 2-home "tab=0"
          shoot 3-pitchside "tab=1"
          shoot 4-pep "tab=2"
          shoot 5-me "tab=3"
          shoot 7-video "video=00000000-0000-4000-8000-000000000001"
          ls -la shots
      - name: Save to the screenshots branch
        run: |
          cd shots
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "Screenshots of ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screenshots
      - if: always()
        run: tail -50 /tmp/api.log || true
