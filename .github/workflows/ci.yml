# CONTINUOUS INTEGRATION: every push and pull request is checked automatically.
#
# Jobs run in parallel on fresh GitHub machines. A pull request can only be
# merged when all of them pass (turn on branch protection: docs/handbook/02-cicd.md).
#
#   lint        ruff (style + likely bugs) and mypy (types)
#   test        the fast tests, on SQLite AND on a real Postgres (the queue
#               uses Postgres-only SQL, so we must test it there too)
#   slow-test   the real YOLO models on the synthetic clip with a known speed
#   docker      both images build (catches a broken Dockerfile before deploy)

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev,coach]"
      - run: ruff check pep tests scripts training deploy
      - run: ruff format --check pep tests scripts training deploy
      - run: mypy pep

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    # A throwaway Postgres next to the job, only used by the "postgres" run.
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: pep, POSTGRES_PASSWORD: pep, POSTGRES_DB: pep }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pep" --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Run tests
        env:
          PEP_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://pep:pep@localhost:5432/pep' || '' }}
        run: |
          if [ -z "$PEP_DATABASE_URL" ]; then unset PEP_DATABASE_URL; fi
          pytest --cov=pep --cov-report=term-missing

  slow-test:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # CPU-only PyTorch: much smaller than the CUDA build, and GitHub's machines have no GPU.
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev,vision]"
      - name: Cache model weights
        uses: actions/cache@v4
        with: { path: var/models, key: yolo26-weights-v1 }
      - run: pytest -m slow -q
        env: { PEP_MODELS_DIR: var/models }

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Smoke-test the API image
        run: |
          docker build -t pep-api .
          docker run -d -p 8000:8000 --name pep pep-api
          for i in $(seq 1 30); do curl -sf localhost:8000/healthz && break; sleep 1; done
          curl -sf localhost:8000/readyz
          docker logs pep
