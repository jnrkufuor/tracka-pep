# The player app (Flutter): check it, test it, and build it for the web and Android.
#
#   check    flutter analyze (static analysis: types, unused code, lints) + flutter test
#   web      build the web app; deploy it to Cloudflare Pages when the secrets are set
#   android  build installable APKs (download them from the run's Artifacts)
#
# iOS builds need a Mac runner and an Apple developer account: see docs/handbook/09-mobile.md.

name: App

on:
  push:
    branches: [main, player-app]
    paths: ["app/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/app.yml"]
  workflow_dispatch: {}

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  web:
    needs: check
    runs-on: ubuntu-latest
    env:
      # The API the web app talks to (the Render address, no slash at the end).
      # Set it under Settings > Secrets and variables > Actions > Variables.
      PEP_API_URL: ${{ vars.PEP_API_URL || 'http://localhost:8000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: ./tool/setup_platforms.sh
      - run: flutter build web --release --dart-define=PEP_API_URL=$PEP_API_URL --dart-define=APP_VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)
      - uses: actions/upload-artifact@v4
        with: { name: tracka-web, path: app/build/web }
      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main' && env.CF_TOKEN != ''
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # First deploy: make the Pages project (fails harmlessly if it exists already).
          npx --yes wrangler@3 pages project create tracka --production-branch main || true
          npx --yes wrangler@3 pages deploy build/web --project-name tracka --branch main

  android:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PEP_API_URL: ${{ vars.PEP_API_URL || 'http://10.0.2.2:8000' }}
      # Firebase (push). Repository variables; empty = push off. See docs/PUSH_SETUP.md.
      FCM: >-
        --dart-define=FCM_API_KEY=${{ vars.FCM_API_KEY }}
        --dart-define=FCM_APP_ID_ANDROID=${{ vars.FCM_APP_ID_ANDROID }}
        --dart-define=FCM_SENDER_ID=${{ vars.FCM_SENDER_ID }}
        --dart-define=FCM_PROJECT_ID=${{ vars.FCM_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
            ~/gradle-dl
          key: gradle-${{ runner.os }}-${{ hashFiles('app/pubspec.yaml') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: ./tool/setup_platforms.sh
      - run: ./tool/ci_mirrors.sh
      - name: Build APKs (retries only for download trouble)
        env:
          GRADLE_OPTS: -Dorg.gradle.internal.http.connectionTimeout=180000 -Dorg.gradle.internal.http.socketTimeout=180000 -Dorg.gradle.internal.repository.max.retries=8
        run: |
          # Values pasted into GitHub variables sometimes carry a line break or spaces:
          # squash all whitespace (and Windows-style \r) so each --dart-define stays one argument.
          FCM=$(echo $FCM | tr -d '\r')
          PEP_API_URL=$(echo $PEP_API_URL | tr -d '\r')
          for i in 1 2 3; do
            flutter build apk --release --split-per-abi --dart-define=PEP_API_URL=$PEP_API_URL --dart-define=APP_VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1) $FCM 2>&1 | tee build.log
            [ "${PIPESTATUS[0]}" = 0 ] && exit 0
            grep -qE '\.dart:[0-9]+:[0-9]+: Error' build.log && exit 1
            sleep $((i * 45))
          done
          exit 1
      - run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/Tracka.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/Tracka-older-phones.apk
      - uses: actions/upload-artifact@v4
        with: { name: tracka-android, path: app/dist/*.apk }
