# Render Blueprint for FREE TESTING: the API and a database, at no cost.
#
# In Render: New > Blueprint > pick jnrkufuor/tracka-pep, branch main.
# Render asks for the values marked `sync: false`. For launch, use
# render.prod.yaml (paid plans) instead.
#
# What "free" means on Render (docs/handbook/03-the-cloud.md):
#   - the API falls asleep after 15 minutes with no visitors; the first call
#     after that takes about a minute while it wakes up;
#   - the free database stops working 30 days after you create it, and is
#     deleted 14 days later unless you upgrade. Fine for testing, never for
#     real players' data;
#   - background workers can't be free, so there's no worker here. Clips are
#     analysed by the GPU worker on Modal (its free plan includes monthly
#     credits): see "Clips" in docs/RUNBOOK.md. Without it, clips upload but
#     wait in the queue.

databases:
  - name: pep-db
    region: frankfurt         # Render's closest region to Ghana
    plan: free
    databaseName: pep
    user: pep

services:
  - type: web
    name: pep-api
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /readyz
    envVars:
      - key: PEP_ENV
        value: prod
      - key: PEP_DATABASE_URL
        fromDatabase: { name: pep-db, property: connectionString }
      - key: COACH_API_KEY          # any long random text (or tracka-api's value, if it still sends clips)
        generateValue: true
      - key: COACH_WEBHOOK_SECRET
        generateValue: true
      - key: PEP_JWT_SECRET         # signs logins
        generateValue: true
      - key: PEP_LAB_PASSWORD       # Pep Lab: user "lab", this password (see it under Environment)
        generateValue: true
      - key: PEP_KICK_TOKEN         # lets the API wake the Modal worker; copy it into Modal's secret
        generateValue: true
      - key: PEP_KICK_URL           # the Modal "kick" address, once the worker is deployed (empty is fine)
        sync: false
      - key: PEP_PUBLIC_URL         # this service's address, e.g. https://pep-api.onrender.com
        sync: false
      - key: PEP_CORS_ORIGINS       # the web app's address, as a list: ["https://tracka.pages.dev"]
        sync: false
      - key: PEP_STORAGE
        value: s3
      - key: PEP_S3_BUCKET
        value: pep-clips
      - key: PEP_S3_ENDPOINT        # https://<account-id>.r2.cloudflarestorage.com
        sync: false
      - key: PEP_S3_ACCESS_KEY
        sync: false
      - key: PEP_S3_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY         # optional: without it Pep writes rule-based notes
        sync: false
      - key: PEP_FCM_SERVICE_ACCOUNT  # optional: push notifications (docs/PUSH_SETUP.md)
        sync: false
      - key: PEP_SENTRY_DSN         # optional: error tracking
        sync: false
      - key: PEP_SUPPORT_EMAIL
        sync: false
