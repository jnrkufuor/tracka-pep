# pyproject.toml is the single file that describes a modern Python project:
# its name, its dependencies, and the settings for the tools we run on it
# (ruff, mypy, pytest). `pip install -e ".[dev]"` reads this file.
#
# Dependencies are split into "extras" on purpose (see docs/handbook/01-architecture.md):
#   - the API only needs the light ones, so its Docker image stays small;
#   - the worker adds [vision] (PyTorch + YOLO, several GB);
#   - [coach] adds the Gemini client; [train] adds what training scripts need.

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tracka-pep"
version = "0.1.0"
description = "Pep: Tracka's AI coach. Reads a player's clip, measures them, scores them by role, and explains how to improve."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "structlog>=24.1",
  "prometheus-client>=0.20",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "scipy>=1.12",
  "boto3>=1.34",
  "pyjwt[crypto]>=2.8",          # [crypto]: RS256, to sign the Firebase service-account token
]

[project.optional-dependencies]
vision = [
  "ultralytics>=8.4",           # YOLO26 detection + pose + ByteTrack. AGPL-3.0: read docs/handbook/04-models.md "Licences".
  "opencv-python-headless>=4.9",
  "lap>=0.5.12",                # the assignment solver ByteTrack uses
]
coach = ["google-genai>=1.0"]
train = ["scikit-learn>=1.4", "joblib>=1.3", "pandas>=2.2"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "mypy>=1.10",
  "opencv-python-headless>=4.9",
  "scikit-learn>=1.4",
  "joblib>=1.3",
]

[project.scripts]
# `pep ...` on the command line runs pep/cli.py (analyse a clip, run the worker, serve the API).
pep = "pep.cli:main"

[tool.setuptools.packages.find]
include = ["pep*"]

[tool.setuptools.package-data]
pep = ["data/*.json"]

# ---------------------------------------------------------------- tools

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# E/F: real errors, I: import order, UP: modern syntax, B: likely bugs, SIM: simpler code.
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
  "E501",    # long lines are fine when a comment needs them
  "SIM108",  # an if/else block is often clearer than a long ternary
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/File()/Form() in default arguments is the framework's intended style.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Header"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "slow" tests download YOLO weights and run real models; CI runs them in a separate job.
markers = ["slow: needs the [vision] extra and model weights"]
addopts = "-q -m 'not slow'"
# Ultralytics and the Gemini SDK return very loose types (tensor-or-array, list-or-iterator).
# We check what we can and accept their looseness at these two edges only.
[[tool.mypy.overrides]]
module = ["pep.vision.perception", "pep.coach.llm"]
disable_error_code = ["index", "union-attr", "arg-type", "misc"]
